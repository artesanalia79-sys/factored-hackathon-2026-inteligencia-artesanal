# Install once per clone:  uv run pre-commit install
# Run on everything:       uv run pre-commit run --all-files
# These hooks are the real enforcement layer (agent instructions are only guidance).
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: check-forbidden-paths
        name: block organizer data, secrets and held-out material
        entry: python scripts/hooks/check_forbidden_paths.py
        language: python
        pass_filenames: true
        # Runs on every staged file, including ignored-but-force-added ones.
      - id: skills-in-sync
        name: agent skills copies are in sync with .agents/skills
        entry: python scripts/sync_skills.py --check
        language: python
        pass_filenames: false
        files: ^\.(agents|claude|kiro)/skills/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: check-json
        exclude: ^web/tsconfig.*\.json$
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
