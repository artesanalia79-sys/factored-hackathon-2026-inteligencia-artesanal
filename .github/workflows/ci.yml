name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests, contracts, fixtures, hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install dependencies (locked)
        # --group data pulls in the ingest lane (boto3, pyarrow) so its lint/types/tests run too.
        # No AWS credentials are used or needed here: ingest tests fake S3 entirely (tests/ingest).
        run: uv sync --locked --group data

      - name: Definition-of-Done gate (ruff, pyright, pytest)
        run: uv run poe check

      - name: Skills mirrors in sync
        run: uv run poe skills-check

      - name: Contracts JSON Schemas up to date
        run: uv run poe contracts-check

      - name: Fixture bank matches committed hash and serving contract
        run: uv run poe fixtures-check

      - name: Evaluation smoke test (StubProvider, 0 USD)
        run: uv run poe eval-smoke

      - name: Cache pre-commit environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks on all files
        # gitleaks runs in its own job below with the full git history.
        env:
          SKIP: gitleaks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  image:
    name: container image (context, non-root, dispute over HTTP, size, memory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the image and prove what docs/operations.md says about it
        # Nobody on the team needs Docker locally: this job is where the image is built and
        # measured (size and memory go to the job summary). Until the T26 freeze Render deployed
        # a commit only after every check on it passed, this one included; since then a release
        # is deployed by hand (render.yaml, docs/operations.md).
        # No secret is used: the app secret and the access code are generated for the run.
        run: bash scripts/image_smoke.sh --plant-decoys

  web:
    name: web UI (contracts, types, lint, build, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies (locked; the API the browser talks to)
        run: uv sync --locked

      - name: Install web dependencies (locked)
        working-directory: web
        run: npm ci

      - name: API types match docs/contracts, strict TypeScript, lint
        working-directory: web
        run: npm run check

      - name: Production build (served by FastAPI from web/dist)
        working-directory: web
        run: npm run build

      - name: Synthetic fixture bank for the API
        run: uv run poe fixtures

      - name: Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End to end against the real API (stub LLM, fresh ops store, random secret)
        working-directory: web
        run: npx playwright test

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The repo is user-owned, so no GITLEAKS_LICENSE is needed. If it moves to an
          # organization, add a free license from gitleaks.io as the GITLEAKS_LICENSE secret.
