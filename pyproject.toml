[project]
name = "bankagent"
version = "0.1.0"
description = "AI-first transaction dispute intake agent for a LATAM bank (Factored AI & Data Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "tzdata==2026.4",
]

# Lane-specific dependencies are added by the task that needs them, always pinned, e.g.
#   uv add --group data "dbt-duckdb==1.11.0"
#   uv add --group api "fastapi==0.141.1"
[dependency-groups]
# Identity, sessions and the HTTP API (T7, T13). Installed by default (see default-groups).
api = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pyjwt==2.15.0",
    "uvicorn==0.54.0",
]
# Ingest (T4) and dbt silver/gold (T5, T6). Not installed by default: `uv sync --group data`.
data = [
    "boto3==1.43.103",
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "pyarrow==25.0.1",
]
dev = [
    "poethepoet==0.48.0",
    "pre-commit==4.6.2",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
llm = [
    "openai==3.19.2",
]
# Learned intent router (T18): training, evaluation and the MLflow run. Installed by default so
# `poe check` type-checks and tests it everywhere; the image skips it (`--no-default-groups`).
ml = [
    "mlflow-skinny==3.16.1",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "threadpoolctl==3.7.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["api", "dev", "llm", "ml"]

# ---------------------------------------------------------------------------
# Task runner (cross-platform; no make on Windows). Run `uv run poe` to list.
# ---------------------------------------------------------------------------
[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Lint (ruff)" }
format-check = { cmd = "ruff format --check .", help = "Check formatting (ruff)" }
fmt = { sequence = ["ruff format .", "ruff check --fix ."], default_item_type = "cmd", help = "Auto-format and auto-fix" }
typecheck = { cmd = "pyright", help = "Static type check (pyright)" }
test = { cmd = "pytest", help = "Run the test suite" }
check = { sequence = ["lint", "format-check", "typecheck", "test"], help = "Definition-of-Done gate: lint + format + types + tests" }

contracts = { cmd = "python -m bankagent.contracts.export", help = "Export shared contracts as JSON Schema to docs/contracts/" }
contracts-check = { cmd = "python -m bankagent.contracts.export --check", help = "Fail if docs/contracts/ is stale" }
fixtures = { cmd = "python -m bankagent.fixtures.builder", help = "Build the team-generated fixture bank DuckDB (data/fixtures/)" }
fixtures-check = { cmd = "python -m bankagent.fixtures.builder --check", help = "Fail if the fixture bank drifts from its committed content hash or contract" }

sync-skills = { cmd = "python scripts/sync_skills.py", help = "Copy .agents/skills to .claude/skills and .kiro/skills" }
skills-check = { cmd = "python scripts/sync_skills.py --check", help = "Fail if skill copies drift from .agents/skills" }
init-env = { cmd = "python scripts/init_env.py", help = "Create a local .env from .env.example (never prints values)" }
hooks = { cmd = "pre-commit install", help = "Install git pre-commit hooks" }
secrets-scan = { cmd = "pre-commit run --all-files", help = "Run all pre-commit hooks on the whole repo" }

ingest = { cmd = "python -m bankagent.ingest.cli", help = "[Task 4] S3 -> bronze parquet + manifest (needs: uv sync --group data)" }
ingest-check = { cmd = "python -m bankagent.ingest.cli --check", help = "[Task 4] Verify bronze files against _manifest.json (sha256 + row counts), no download" }

dbt-build = { cmd = "python -m bankagent.silver.cli", help = "[Task 5] Verify bronze manifest, then dbt build silver (needs: uv sync --group data)" }
dq-report = { cmd = "python -m bankagent.silver.report", help = "[Task 5] Regenerate docs/evidence/dq_report.md + fraud_score_thresholds.md from the warehouse" }
serving-build = { cmd = "python -m bankagent.gold.cli", help = "[Task 6] dbt build gold on verified silver, write data/serving/bank_curated.duckdb and validate it (needs: uv sync --group data)" }
curated-check = { cmd = "python -m bankagent.curated.cli --check", help = "[Task 19] Check the serving DB that DATA_MODE=curated opens (data/serving/bank_curated.duckdb): it records curated data, fits the serving contract, and every row parses into the views the runtime reads" }
curated-e2e = { cmd = "python -m bankagent.curated.cli", help = "[Task 19] The agent end to end on the curated serving DB, local only: the production app over HTTP for real customers, sessions opened in code, every outcome checked; writes docs/evidence/curated_e2e.md (counts only). Needs `poe serving-build`; keyword interpreter, 0 USD" }

eval-smoke = { cmd = "python -m bankagent.eval.cli smoke", help = "[Task 12] Dev cases x 3 repeats through the scripted fakes, StubProvider, 0 USD; writes eval/runs/smoke/report.md" }
eval-run = { cmd = "python -m bankagent.eval.cli run", envfile = ".env", help = "[Task 12] Real systems on real tools, fresh ops store per run: --system baseline|proposed, --provider stub|openai|compat (real providers cost money or quota: owner approval first)" }
heldout = { cmd = "python -m bankagent.eval.heldout", envfile = ".env", help = "[Task 17] Held-out set in HELDOUT_DIR: `poe heldout check [--partial] | sample --out DIR | kappa --annotations DIR | seal | verify` (prints counts and file names, never case content)" }

policy-explain = { cmd = "python -m bankagent.policy.cli", help = "[Task 9] Explain one policy decision: `poe policy-explain <customer_id> <transaction_id>` on the fixture bank" }
router = { cmd = "python -m bankagent.eval.router.cli train", help = "[Task 18] Learned intent router: train and evaluate it against the keyword router on eval/router/ (split-conformal α = 0.1, 0 USD), write docs/evidence/router_eval.md and log an MLflow run to mlruns/" }
router-predict = { cmd = "python -m bankagent.eval.router.cli predict", help = "[Task 18] Route one message with the router `poe router` evaluates: `poe router-predict \"No reconozco este cargo\"` prints its RouterResult and the keyword router's intent" }

# Placeholders owned by later tasks (they fail loudly until implemented).
analysis = { cmd = "python -m bankagent.analysis.report", help = "[Task 16] Regenerate docs/evidence/{call_center_baseline,complaints_baseline,roi}.md + roi_tornado.svg from the warehouse and config/roi_assumptions.yaml (pass --eval-results after T27)" }
eval-full = { cmd = "python -m bankagent.eval.final", envfile = ".env", help = "[Task 27] Final evaluation: both systems on the sealed held-out set (HELDOUT_DIR), real model. Without --approved-by <owner> it only prints the plan and reads no case. Rehearsal: --cases eval/dev --provider stub" }
serve = { cmd = "uvicorn bankagent.api.wiring:create_default_app --factory --host 0.0.0.0 --port 8000 --workers 1", envfile = ".env", help = "[Task 13] Run the API locally (reads .env: LLM_PROVIDER stub|openai|compat, OPENAI_API_KEY, LLM_SPEND_LIMIT_USD), and the web UI at / once `poe web-build` ran" }
smoke = { cmd = "python scripts/smoke_dispute.py", envfile = ".env", help = "[Task 15] One full dispute over HTTP against a running service: `poe smoke https://...` (sends DEMO_ACCESS_CODE from .env if set)" }
image-smoke = { cmd = "bash scripts/image_smoke.sh", help = "[Task 15] Build the container image and check it (needs Docker; CI runs it on every push)" }

web-install = { cmd = "npm --prefix web ci", help = "[Task 14] Install the web UI's locked npm dependencies" }
web-build = { cmd = "npm --prefix web run build", help = "[Task 14] Build the web UI into web/dist; `poe serve` then serves it at /" }
web-check = { cmd = "npm --prefix web run check", help = "[Task 14] Web UI: API types vs docs/contracts, strict TypeScript, lint" }
web-e2e = { cmd = "npm --prefix web run e2e", help = "[Task 14] Playwright against the real API (after web-build and `poe fixtures`; first time: npx --prefix web playwright install chromium)" }

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "data", "private", ".agents", ".claude", ".kiro"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = [
    "RUF001", # ambiguous unicode in strings: we intentionally handle ES/PT text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"src/bankagent/fixtures/**" = ["S311"] # deterministic seeded generator, not crypto

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
