# Dispute policy, version 1 (Task 9). Loaded and validated by `bankagent.policy.schema`.
#
# Evaluated in this order by `bankagent.policy.engine.evaluate`:
#   1. eligibility rules (approved_status, no_open_case, window), short-circuit on the first
#      failure -> decision: ineligible, no write actions.
#   2. escalation rules (fraud_score, repeat_disputer, dq_flag), evaluated together if
#      eligibility passed -> decision: escalate (no write actions) when any trigger fires.
#   3. otherwise -> decision: proceed, create_dispute allowed, block_card allowed only when the
#      action rule (card_blockable) allows the transaction's card; confirmation required,
#      sla_due_date = filed_on + sla_days.
# The schema requires exactly one rule of each kind.
#
# Provenance labels (`poe policy-explain` prints them):
#   synthetic: true  -> a placeholder, not checked against a primary source (docs/limitations.md)
#   internal: true   -> a system invariant (what the bank's own records allow); nothing external
#                       to verify
#   neither          -> verified; needs verified_by and verified_on
#
# Not rules (descoped from issue #9 on 2026-10-02, docs/decision_ledger.md): high amount and
# foreign transaction. No verified threshold exists for either, and fraud_score (DSP-ESC-01)
# is the risk signal ADR 0003 measured.

policy_version: dispute-v1.1
sla_days: 30

rules:
  - rule_id: DSP-ELIG-01
    kind: approved_status
    description: >
      Only a settled (Approved) transaction can be disputed. Declined charged nothing final,
      Pending has not settled yet, Reversed is already undone.
    explanation_key: dispute.not_settled
    provenance:
      synthetic: false
      internal: true
      source: "bankagent.contracts.enums.TransactionStatus; a non-Approved transaction has no
        completed charge to dispute"

  - rule_id: DSP-ELIG-02
    kind: no_open_case
    description: >
      A transaction that already has an open case cannot be disputed again: an agent-made
      dispute (store.get_dispute) or a still-open prior complaint (Open, In Process or
      Escalated in dispute_history, from before the agent existed).
    explanation_key: dispute.already_disputed
    provenance:
      synthetic: false
      internal: true
      source: "store/ops.py DisputeAlreadyExists (one dispute per transaction) and
        tools/writes.py open_complaint_id check (T8 PR #43 review); defense in depth, CHECK_POLICY
        refuses before CONFIRM/ACT"

  - rule_id: DSP-WIN-01
    kind: window
    description: >
      A dispute must be filed within this many days of the transaction date, counted from the
      serving DB's as_of_date (not the wall clock).
    explanation_key: dispute.out_of_window
    window_days:
      AR: 90
      MX: 90
      CO: 90
    provenance:
      synthetic: true
      source: "placeholder pending legal verification; no primary source checked yet for AR, MX
        or CO"
    todo: "TODO(T9, Juan José): verify Argentina Ley 25.065 arts. 26-29 and the MX/CO equivalents
      against a primary source before this policy is used on real customers; window_days is a
      synthetic placeholder until then (docs/limitations.md)."

  - rule_id: DSP-ESC-01
    kind: fraud_score
    description: >
      A disputed transaction at or above the fraud_score threshold is escalated to a human
      instead of auto-creating the dispute. A missing score (no row, or NULL: about 20% of
      curated transactions) does not escalate: escalating them would send a fifth of all
      disputes to a human, and ADR 0003 accepts that score-based escalation misses them.
    explanation_key: dispute.fraud_risk
    threshold: 30.0
    provenance:
      synthetic: false
      source: "ADR 0003 (accepted); docs/evidence/fraud_score_thresholds.md, offline on 4.43M
        labelled transactions (4,316 fraud, base rate 0.0975%): >=30 escalates 2,982 transactions
        (0.067%) at precision 0.80, recall 0.55"
      verified_by: "Santiago, Juan José"
      verified_on: "2026-09-29"

  - rule_id: DSP-ESC-02
    kind: repeat_disputer
    description: >
      A customer with a prior dispute in the last window_days is escalated to a human for this
      dispute instead of auto-creating it. A prior dispute is either a case in the bank's
      dispute_history (category Transactions, case type Complaint or Claim, any status),
      counted against as_of_date, or a dispute the agent itself created, counted against the
      filing day. So a second dispute in the same conversation escalates: several unrecognized
      charges are worth a human look, even when they are one incident. The history uses T16's
      case types over the whole Transactions category, not T16's strict subcategory "Cargo no
      reconocido": the fixture's subcategories are in English, and a Transactions case with no
      subcategory may still be a disputed charge.
    explanation_key: dispute.repeat_disputer
    window_days: 90
    provenance:
      synthetic: true
      source: "business heuristic (serial-dispute risk signal), not externally verified"
    todo: "TODO(T9, Juan José): business sign-off on the repeat-disputer window and on whether a
      repeat disputer should escalate or only add context to a human review."

  - rule_id: DSP-ESC-03
    kind: dq_flag
    description: >
      A transaction whose own record is inconsistent is escalated to a human instead of
      auto-creating the dispute: a charge dated before its card was opened. Other data-quality
      flags do not escalate: dq_possible_duplicate is the very thing a duplicate-charge dispute
      is about, and dq_txn_after_card_expiry is on 46% of the disputable curated transactions
      (a generator artefact), so escalating it would send half of all disputes to a human.
    explanation_key: dispute.data_inconsistent
    flags: [dq_txn_before_product_opening]
    provenance:
      synthetic: true
      source: "data-quality heuristic; curated serving DB 2026-06-17: 1,934 of 121,244 disputable
        transactions (Approved, last 90 days) carry dq_txn_before_product_opening (1.6%)"
    todo: "TODO(T9, Juan José): business sign-off on which data-quality flags should stop an
      automatic dispute."

  - rule_id: DSP-ACT-01
    kind: card_blockable
    description: >
      On proceed, block_card is allowed only for the transaction's own card, and only while the
      core reports it Active. A Blocked, Closed or Suspended card is already out of use, so the
      dispute is still created but no block is offered.
    explanation_key: dispute.card_not_blockable
    statuses: [Active]
    provenance:
      synthetic: false
      internal: true
      source: "bankagent.contracts.enums.ProductStatus; T8 PR #43 review follow-up (block_card
        ignored the core status)"
