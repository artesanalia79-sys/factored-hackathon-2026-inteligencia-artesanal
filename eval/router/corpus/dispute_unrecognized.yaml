    utterances:
      - {dialect: es-MX, text: "Tengo un cargo en dólares de una tienda en Miami y yo no he salido de México"}
      - {dialect: es-CO, text: "Me sale un cobro en euros de un hotel en Madrid y nunca he ido a España"}
