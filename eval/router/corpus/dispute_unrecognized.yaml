# Synthetic first messages for the learned intent router (Task 18), one file per intent.
# Written for this task by an AI coding assistant; a teammate reviews a sample before merge and
# fills `reviewed_by`. Labeling policy and use: docs/models/router.md. Each group is one scenario
# in five dialects, so its paraphrases never cross a split. Never copy held-out cases here.
intent: dispute_unrecognized
provenance: llm_generated_reviewed
author: claude-code
reviewed_by: jjresher
groups:
  - id: unr-01 # a merchant the customer does not know
    utterances:
      - {dialect: es-MX, text: "Oiga, me aparece un cargo de 1,890 pesos en una tienda que se llama COMERCIAL DEL BAJIO y yo nunca he comprado ahí"}
      - {dialect: es-CO, text: "Buenas tardes, en el extracto me sale un cobro de 230.000 pesos de un comercio que no conozco, yo no hice esa compra"}
      - {dialect: es-AR, text: "Che, me figura un consumo de 45.000 en un local que ni sé dónde queda, yo no fui"}
      - {dialect: es-neutral, text: "Tengo un cargo de un comercio que no conozco y yo no realicé esa compra"}
      - {dialect: pt-BR, text: "Apareceu uma compra no meu cartão de uma loja que eu nunca ouvi falar, não fui eu que comprei"}
  - id: unr-02 # an online game purchase
    utterances:
      - {dialect: es-MX, text: "alguien compro en una tienda de videojuegos con mi tarjeta, yo ni juego eso, son como 3 mil pesos"}
      - {dialect: es-CO, text: "Me aparecen unas compras en Steam y yo ni tengo cuenta en Steam"}
      - {dialect: es-AR, text: "Me debitaron una compra de juegos online que no hice, ni siquiera tengo consola"}
      - {dialect: es-neutral, text: "Hay una compra en una plataforma de videojuegos que yo no autoricé"}
      - {dialect: pt-BR, text: "Fizeram uma compra de jogos com meu cartão, eu nem jogo videogame"}
  - id: unr-03 # a cloned card
    utterances:
      - {dialect: es-MX, text: "Creo que me clonaron la tarjeta, tengo cargos en Monterrey y yo vivo en Puebla"}
